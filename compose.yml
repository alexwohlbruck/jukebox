services:
  # Mints YouTube PO tokens for yt-dlp. Pinned to match the plugin version
  # installed in the image; the two are expected to move together.
  bgutil-provider:
    container_name: bgutil-provider
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    init: true
    networks:
      - caddy
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  jukebox:
    container_name: jukebox
    image: ghcr.io/alexwohlbruck/jukebox:latest
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      POT_PROVIDER_BASE_URL: http://bgutil-provider:4416
    networks:
      - caddy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  caddy:
    external: true
    name: opt_caddy
